<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #f0f0f0;
    --accent-dim: #aaaaaa;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff6b6b;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .widget {
    width: 100%;
    max-width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.running { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-dot.done { background: var(--danger); }

  .display {
    text-align: center;
    padding: 8px 0;
  }

  .time-big {
    font-family: 'DM Mono', monospace;
    font-size: 56px;
    font-weight: 400;
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }
  .time-big.accent { color: var(--accent); }
  .time-big.danger { color: var(--danger); }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 14px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    width: 100%;
    transition: width 1s linear, background 0.3s;
  }
  .progress-fill.danger { background: var(--danger); }

  .duration-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .duration-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dur-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .dur-btn:hover:not(:disabled) { background: #2a2a2a; border-color: #444; }
  .dur-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .dur-display {
    flex: 1;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--text);
    background: #141414;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 0;
    cursor: pointer;
    position: relative;
  }

  .dur-display input {
    position: absolute; inset: 0;
    opacity: 0;
    width: 100%; height: 100%;
    cursor: pointer;
    border: none; background: transparent;
  }

  .presets {
    display: flex;
    gap: 6px;
  }

  .preset {
    flex: 1;
    padding: 5px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset:hover { border-color: var(--accent-dim); color: var(--accent); }
  .preset.active { border-color: var(--accent); color: var(--accent); background: rgba(200,245,102,0.06); }

  .controls {
    display: flex;
    gap: 8px;
  }

  .btn-start {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);

    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .btn-start:hover { opacity: 0.88; }
  .btn-start:active { transform: scale(0.98); }
  .btn-start.pause { background: #2a2a2a; color: var(--text); border: 1px solid var(--border); }

  .btn-reset {
    width: 46px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-reset:hover { border-color: #444; color: var(--text); }

  .done-msg {
    text-align: center;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.05em;
    display: none;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pulsing { animation: pulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="widget">
  <div class="top" style="justify-content:flex-end">
    <div class="status-dot" id="dot"></div>
  </div>

  <div class="display">
    <div class="time-big" id="timeDisplay">30:00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="duration-section">
    <div class="duration-row">
      <button class="dur-btn" id="durMinus" onclick="changeDur(-1)">−</button>
      <div class="dur-display" id="durDisplay" title="Cliquer pour modifier">
        <span id="durText">30 min</span>
        <input type="number" id="durInput" min="1" max="480" value="30" onchange="setDurFromInput(this.value)" />
      </div>
      <button class="dur-btn" id="durPlus" onclick="changeDur(1)">+</button>
    </div>
    <div class="presets">
      <button class="preset" onclick="setDur(15)">15 min</button>
      <button class="preset" onclick="setDur(30)">30 min</button>
      <button class="preset" onclick="setDur(45)">45 min</button>
      <button class="preset" onclick="setDur(60)">1 h</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="toggleTimer()">▶ Start</button>
    <button class="btn-reset" onclick="resetTimer()" title="Réinitialiser">↺</button>
  </div>

  <div class="done-msg" id="doneMsg">✓ Terminé !</div>
</div>

<script>
  const STORAGE_KEY = 'notion_timer_duration_' + location.hostname + location.pathname;

  let totalSeconds = 0;
  let remaining = 0;
  let interval = null;
  let running = false;
  let durationMin = 30;

  function loadSaved() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      durationMin = parseInt(saved) || 30;
    }
  }

  function saveDur() {
    localStorage.setItem(STORAGE_KEY, durationMin);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return pad(m) + ':' + pad(sec);
  }

  function updateDisplay() {
    const el = document.getElementById('timeDisplay');
    el.textContent = formatTime(remaining);
    el.className = 'time-big' + (running && remaining > 0 ? ' accent' : '') + (remaining === 0 && totalSeconds > 0 ? ' danger' : '');

    const pct = totalSeconds > 0 ? (remaining / totalSeconds) * 100 : 100;
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill' + (pct < 20 ? ' danger' : '');
  }

  function updateDurUI() {
    document.getElementById('durText').textContent = durationMin < 60 ? durationMin + ' min' : (durationMin % 60 === 0 ? (durationMin/60) + ' h' : Math.floor(durationMin/60) + 'h' + pad(durationMin%60));
    document.getElementById('durInput').value = durationMin;
    document.querySelectorAll('.preset').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent) === durationMin || (b.textContent === '1 h' && durationMin === 60));
    });
  }

  function setDur(min) {
    if (running) return;
    durationMin = min;
    saveDur();
    updateDurUI();
    resetTimer();
  }

  function changeDur(delta) {
    if (running) return;
    const steps = [1,2,3,5,10,15,20,30,45,60,90,120,180,240,300,360,480];
    let idx = steps.findIndex(s => s >= durationMin);
    if (idx === -1) idx = steps.length - 1;
    if (delta > 0 && durationMin < steps[steps.length-1]) {
      if (durationMin === steps[idx]) idx = Math.min(idx+1, steps.length-1);
    } else if (delta < 0) {
      idx = Math.max(0, (durationMin === steps[idx] ? idx-1 : idx));
    }
    setDur(steps[idx]);
  }

  function setDurFromInput(val) {
    const v = Math.max(1, Math.min(480, parseInt(val) || 1));
    setDur(v);
  }

  function toggleTimer() {
    if (remaining === 0 && totalSeconds > 0) { resetTimer(); return; }
    if (!running) {
      if (remaining === 0 || totalSeconds === 0) {
        totalSeconds = durationMin * 60;
        remaining = totalSeconds;
      }
      running = true;
      interval = setInterval(tick, 1000);
      document.getElementById('startBtn').textContent = '⏸';
      document.getElementById('startBtn').classList.add('pause');
      document.getElementById('dot').className = 'status-dot running';
      document.getElementById('doneMsg').style.display = 'none';
      setControlsDisabled(true);
    } else {
      clearInterval(interval);
      running = false;
      document.getElementById('startBtn').textContent = '▶';
      document.getElementById('startBtn').classList.remove('pause');
      document.getElementById('dot').className = 'status-dot';
      setControlsDisabled(false);
    }
    updateDisplay();
  }

  function tick() {
    if (remaining > 0) {
      remaining--;
      updateDisplay();
    }
    if (remaining === 0) {
      clearInterval(interval);
      running = false;
      document.getElementById('startBtn').textContent = '↺ Recommencer';
      document.getElementById('startBtn').classList.remove('pause');
      document.getElementById('dot').className = 'status-dot done';
      document.getElementById('doneMsg').style.display = 'block';
      setControlsDisabled(false);
      try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...').play(); } catch(e) {}
    }
  }

  function resetTimer() {
    clearInterval(interval);
    running = false;
    totalSeconds = 0;
    remaining = 0;
    document.getElementById('startBtn').textContent = '▶ Start';
    document.getElementById('startBtn').classList.remove('pause');
    document.getElementById('dot').className = 'status-dot';
    document.getElementById('doneMsg').style.display = 'none';
    document.getElementById('timeDisplay').textContent = formatTime(durationMin * 60);
    document.getElementById('timeDisplay').className = 'time-big';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressFill').className = 'progress-fill';
    setControlsDisabled(false);
  }

  function setControlsDisabled(disabled) {
    document.getElementById('durMinus').disabled = disabled;
    document.getElementById('durPlus').disabled = disabled;
    document.querySelectorAll('.preset').forEach(b => b.disabled = disabled);
  }

  loadSaved();
  updateDurUI();
  document.getElementById('timeDisplay').textContent = formatTime(durationMin * 60);
</script>
</body>
</html>
